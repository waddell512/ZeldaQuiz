<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Spectral:wght@300;400&display=swap">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1200px;height:630px;overflow:hidden}
  body{
    background:
      radial-gradient(120% 90% at 50% 8%, #1E2038 0%, #15172A 45%, #0C0D18 100%);
    color:#E8E7EC;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:30px;position:relative;font-family:Spectral,Georgia,serif;
  }
  /* the stone trim the real page runs along its top and bottom edge */
  .trim{position:absolute;left:0;width:100%;height:20px;color:#B99542;opacity:.5}
  .trim.t{top:0} .trim.b{bottom:0}
  .ring{position:relative;width:250px;height:250px}
  .ring svg.tri{position:absolute;inset:46px;color:#B99542}
  .med{
    position:absolute;width:34px;height:34px;border-radius:50%;
    left:50%;top:50%;margin:-17px 0 0 -17px;
    box-shadow:0 0 0 2.5px rgba(232,231,236,.22), 0 0 18px 2px currentColor;
  }
  h1{
    font-family:Cinzel,serif;font-weight:700;font-size:82px;line-height:1;
    letter-spacing:.06em;text-transform:uppercase;
    background:linear-gradient(180deg,#F3E6BE,#B99542 70%,#8A6D1F);
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  }
  .rule{width:340px;height:1px;background:linear-gradient(90deg,transparent,#B99542,transparent)}
  p.sub{font-size:33px;color:#C9C7D6;letter-spacing:.01em}
  p.kicker{
    font-family:Cinzel,serif;font-size:19px;letter-spacing:.3em;text-transform:uppercase;
    color:#B99542;opacity:.95;
  }
</style></head><body>

<svg class="trim t" width="1200" height="20" preserveAspectRatio="none"><defs>
<pattern id="pt" width="34" height="20" patternUnits="userSpaceOnUse">
<path d="M17 4 L9.5 16 L24.5 16 Z" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/>
<path d="M0 16 L34 16" stroke="currentColor" stroke-width=".8"/></pattern></defs>
<rect width="1200" height="20" fill="url(#pt)"/></svg>

<p class="kicker">Ocarina of Time</p>

<div class="ring" id="ring">
  <svg class="tri" viewBox="0 0 100 100">
    <g fill="currentColor" fill-opacity=".22" stroke="currentColor" stroke-width="2.6" stroke-linejoin="round">
      <path d="M50 8 L29.2 44 L70.8 44 Z"/>
      <path d="M27.6 47.5 L6.8 83.5 L48.4 83.5 Z"/>
      <path d="M72.4 47.5 L51.6 83.5 L93.2 83.5 Z"/>
    </g>
  </svg>
</div>

<h1>The Sage Trials</h1>
<div class="rule"></div>
<p class="sub">Which Ocarina of Time Sage are you?</p>

<svg class="trim b" width="1200" height="20" preserveAspectRatio="none"><use href="#pt"/>
<rect width="1200" height="20" fill="url(#pt)"/></svg>

<script>
  // the seven medallions, laid on a circle in game order, Time at the top
  var cols=["#5E6E8E","#3F7C43","#B32E22","#2A6BA8","#65459B","#B25A1E","#96801F"];
  var r=document.getElementById("ring"), R=118;
  cols.forEach(function(c,i){
    var a=(-90 + i*(360/7)) * Math.PI/180;
    var d=document.createElement("div");
    d.className="med";
    d.style.background=c; d.style.color=c;
    d.style.transform="translate("+(Math.cos(a)*R).toFixed(1)+"px,"+(Math.sin(a)*R).toFixed(1)+"px)";
    r.appendChild(d);
  });
</script>
</body></html>
